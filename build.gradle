plugins {
    id 'net.neoforged.moddev' version '2.0.7-beta'
}

version = '1.0.0'
group = 'com.example.autosprint'

neoForge {
    version = '21.4.11-beta'
    runs {
        client { client() }
    }
    mods {
        autosprint { sourceSet sourceSets.main }
    }
}

repositories { mavenCentral() }
